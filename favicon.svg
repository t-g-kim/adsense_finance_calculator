<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background circle -->
  <circle cx="64" cy="64" r="58" fill="url(#grad1)" filter="url(#shadow)"/>
  
  <!-- Dollar sign -->
  <text x="64" y="88" 
        font-family="Arial, sans-serif" 
        font-size="72" 
        font-weight="bold" 
        fill="white" 
        text-anchor="middle"
        style="paint-order: stroke; stroke: #047857; stroke-width: 2px;">$</text>
  
  <!-- Decorative elements -->
  <circle cx="96" cy="32" r="6" fill="white" opacity="0.8"/>
  <circle cx="32" cy="96" r="4" fill="white" opacity="0.6"/>
</svg>
