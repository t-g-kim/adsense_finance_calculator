<head>
    <meta charset="UTF-8">

    <meta http-equiv="X-UA-Compatible" content="IE=edge">

    <meta name="description" content="Free loan payment calculator for auto, personal & student loans. Calculate monthly payments, total interest and payoff schedule instantly.">
    <meta name="keywords" content="loan calculator, loan payment calculator, auto loan calculator, personal loan calculator, monthly payment">
    <meta name="author" content="Finance Calculator Hub">
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1">

    <meta property="og:type" content="website">
    <meta property="og:url" content="https://finance-calculator-hub.pages.dev/loan-calculator.html">

    <meta property="og:description" content="Calculate monthly loan payments for auto, personal & student loans. See total interest and payment schedule.">
    <meta property="og:image" content="https://finance-calculator-hub.pages.dev/favicon.svg">

    <meta property="og:site_name" content="Finance Calculator Hub">
    
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="Loan Payment Calculator - Auto & Personal Loans">
    <meta name="twitter:description" content="Calculate monthly loan payments for auto, personal & student loans. See total interest and payment schedule.">
    
    <!-- Mobile Optimization -->
    <meta name="theme-color" content="#10b981">
    
    <title>Loan Payment Calculator - Calculate Monthly Loan Payments</title>
    <link rel="canonical" content="https://finance-calculator-hub.pages.dev/loan-calculator.html">
    <link rel="stylesheet" href="css/style.css">
    
    <!-- Preconnect -->
    <link rel="preconnect" href="https://pagead2.googlesyndication.com">
    
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="apple-touch-icon" sizes="180x180" href="favicon.svg">
    
    <!-- Google AdSense -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6690487239486575"
     crossorigin="anonymous"></script>
</head>

<body>
    <header>
        <div class="container">
            <div class="header-content">
                <h1><a href="index.html">💰 Finance Calculator Hub</a></h1>
                <nav><a href="index.html" class="nav-link">Home</a></nav>
            </div>
        </div>
    </header>

    <main class="container">
        <div class="calculator-page">
            <div class="calculator-header">
                <h2>💳 Loan Payment Calculator</h2>
                <p>Calculate monthly payments for any type of loan</p>
            </div>

            <div class="calculator-layout">
                <div class="calculator-main">
                    <div class="calculator-form">
                        <div class="form-group">
                            <label for="loanAmount">Loan Amount ($)</label>
                            <input type="number" id="loanAmount" placeholder="25000" value="25000">
                        </div>

                        <div class="form-group">
                            <label for="interestRate">Interest Rate (% per year)</label>
                            <input type="number" id="interestRate" placeholder="5.5" value="5.5" step="0.01">
                        </div>

                        <div class="form-group">
                            <label for="loanTerm">Loan Term (months)</label>
                            <input type="number" id="loanTerm" placeholder="60" value="60">
                        </div>

                        <button id="calculateBtn" class="btn-primary btn-large">Calculate Payment</button>
                        <div id="result" class="result-box" style="display: none;"></div>
                    </div>
                </div>

                <aside class="calculator-sidebar">
                    <div class="ad-container ad-vertical">
                        <ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-6690487239486575" data-ad-slot="1234567894" data-ad-format="auto" data-full-width-responsive="true"></ins>
                        <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
                    </div>
                </aside>
            </div>
        </div>
    </main>

    <script>
    document.getElementById('calculateBtn').addEventListener('click', function() {
        const loan = parseFloat(document.getElementById('loanAmount').value);
        const rate = parseFloat(document.getElementById('interestRate').value) / 100 / 12;
        const months = parseInt(document.getElementById('loanTerm').value);

        if (!loan || !months) {
            alert('Please fill in all fields');
            return;
        }

        const payment = loan * (rate * Math.pow(1 + rate, months)) / (Math.pow(1 + rate, months) - 1);
        const total = payment * months;
        const interest = total - loan;

        document.getElementById('result').innerHTML = `
            <h4>Payment Summary</h4>
            <p><strong>Monthly Payment:</strong> $${payment.toFixed(2)}</p>
            <p><strong>Total Interest:</strong> $${interest.toFixed(2)}</p>
            <p><strong>Total Paid:</strong> $${total.toFixed(2)}</p>
        `;
        document.getElementById('result').style.display = 'block';
    });
    </script>
</body>
</html>
